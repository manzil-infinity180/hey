# Supply-chain attestation with cilock (CI/lock).
#
# Each real CI tool (build, vuln scan, SAST, SBOM, fs scan) is WRAPPED by cilock,
# which records the environment, git/github context, the traced process tree, the
# input materials + output products, and signs the result as an in-toto / DSSE
# attestation. Signing is KEYLESS via Sigstore (public-good Fulcio) + GitHub OIDC
# — no keys to manage, no TestifySec platform account.
#
# IMPORTANT: the cilock-ACTION traces with ptrace (it runs the rookery library
# in-process). For kernel-side eBPF tracing — the full file + network capture —
# run the cilock BINARY directly with CAP_BPF on a Linux host. See SUPPLY_CHAIN.md
# → "Local testing (real eBPF)".
#
# NOTE on attestors: scanners (govulncheck/gosec/trivy) are captured via the
# universal `sarif` attestor (their SARIF output), which ships in the default
# action binary. `secretscan` and `sbom` ship too.
name: supply-chain

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write   # required for keyless Sigstore signing via GitHub OIDC
  contents: read

jobs:
  attested-build:
    runs-on: ubuntu-latest
    env:
      ATT_DIR: ${{ github.workspace }}/attestations
      # Public-good Sigstore (NOT the TestifySec platform).
      FULCIO_URL: https://fulcio.sigstore.dev
      TSA_URL: https://timestamp.sigstore.dev/api/v1/timestamp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install scanners (govulncheck, gosec, syft, trivy)
        run: |
          mkdir -p "$ATT_DIR" "$HOME/.local/bin"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh   | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 1) Attested build (process tree traced). secretscan RECORDS findings
      #    here (observe) — it scans the traced build's materials, which include
      #    Go toolchain/stdlib fixtures, so a hard fail-on-detection here is noisy.
      #    A scoped secret gate is better run against the repo source (see docs).
      - name: build (cilock)
        uses: aflock-ai/cilock-action@v1.0.4
        with:
          step: build
          attestations: "environment git github secretscan"
          trace: "true"
          fulcio-url: ${{ env.FULCIO_URL }}
          timestamp-servers: ${{ env.TSA_URL }}
          enable-archivista: "false"
          outfile: ${{ env.ATT_DIR }}/build.attestation.json
          command: "go build -o bin/hey ."

      # 2) Go vulnerability scan (call-graph reachability) → SARIF
      - name: govulncheck (cilock)
        uses: aflock-ai/cilock-action@v1.0.4
        with:
          step: govulncheck
          attestations: "environment git github sarif"
          fulcio-url: ${{ env.FULCIO_URL }}
          timestamp-servers: ${{ env.TSA_URL }}
          enable-archivista: "false"
          outfile: ${{ env.ATT_DIR }}/govulncheck.attestation.json
          # govulncheck (v1.x) writes SARIF to stdout; non-zero exit on findings,
          # so `|| true` keeps the step green — the gate is the policy, not exit code.
          command: "sh -c 'govulncheck -format sarif ./... > govulncheck.sarif || true'"

      # 3) Go SAST → SARIF (-no-fail so findings don't fail the wrapped command)
      - name: gosec (cilock)
        uses: aflock-ai/cilock-action@v1.0.4
        with:
          step: gosec
          attestations: "environment git github sarif"
          fulcio-url: ${{ env.FULCIO_URL }}
          timestamp-servers: ${{ env.TSA_URL }}
          enable-archivista: "false"
          outfile: ${{ env.ATT_DIR }}/gosec.attestation.json
          command: "gosec -no-fail -fmt=sarif -out=gosec.sarif ./..."

      # 4) SBOM of the built binary (CycloneDX) → sbom attestor
      - name: sbom (cilock)
        uses: aflock-ai/cilock-action@v1.0.4
        with:
          step: sbom
          attestations: "environment git github sbom"
          fulcio-url: ${{ env.FULCIO_URL }}
          timestamp-servers: ${{ env.TSA_URL }}
          enable-archivista: "false"
          outfile: ${{ env.ATT_DIR }}/sbom.attestation.json
          command: "syft bin/hey -o cyclonedx-json=sbom.cdx.json"

      # 5) Filesystem vulnerability scan → SARIF
      - name: trivy fs (cilock)
        uses: aflock-ai/cilock-action@v1.0.4
        with:
          step: trivy
          attestations: "environment git github sarif"
          fulcio-url: ${{ env.FULCIO_URL }}
          timestamp-servers: ${{ env.TSA_URL }}
          enable-archivista: "false"
          outfile: ${{ env.ATT_DIR }}/trivy.attestation.json
          command: "trivy fs --scanners vuln --format sarif --output trivy.sarif ."

      - name: Summarize attestations
        if: always()
        run: |
          {
            echo "### cilock supply-chain attestations (keyless Sigstore)"
            echo
            echo "| step | sigs | attestors | procs traced |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in "$ATT_DIR"/*.attestation.json; do
            [ -s "$f" ] || continue
            sigs=$(jq '.signatures | length' "$f")
            pl=$(jq -r .payload "$f" | base64 -d)
            step=$(echo "$pl" | jq -r '.predicate.name')
            atts=$(echo "$pl" | jq -rc '[.predicate.attestations[].type | sub(".*/attestations/";"") | sub("/v.*";"")] | join(", ")')
            procs=$(echo "$pl" | jq -r '([.predicate.attestations[] | select(.type|test("command-run"))][0].attestation.processes | length) // 0')
            echo "| $step | $sigs | $atts | $procs |" >> "$GITHUB_STEP_SUMMARY"
          done
          cat "$GITHUB_STEP_SUMMARY"

      # Release gate (fail-closed): require the build to carry the core evidence.
      # secretscan findings are reported as informational (scanning a traced
      # build's materials picks up toolchain/stdlib fixtures — see SUPPLY_CHAIN.md).
      - name: policy gate
        run: |
          pl=$(jq -r .payload "$ATT_DIR/build.attestation.json" | base64 -d)
          findings=$(echo "$pl" | jq '([.predicate.attestations[] | select(.type|test("secretscan"))][0].attestation.findings | length) // 0')
          echo "secretscan findings (informational): $findings"
          echo "$pl" | jq -e '[.predicate.attestations[].type] | (any(test("command-run")) and any(test("product")) and any(test("github")))' >/dev/null \
            && echo "gate PASS: build attestation carries command-run + product + github" \
            || { echo "::error::gate FAIL: build attestation missing required evidence"; exit 1; }

      - name: Upload attestations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-attestations
          path: ${{ env.ATT_DIR }}/*.attestation.json
